<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>folder_icons form demo</title>
<style>
@font-face {
    font-family: Icons; font-style: normal; font-weight: 900;
    src: url("fa-solid-900.woff2") format('woff2');
}
@font-face {
    font-family: Icons; font-style: normal; font-weight: 400;
    src: url("fa-regular-400.woff2") format('woff2');
}
body { font: 14px/1.4 Segoe UI, Roboto, sans-serif; background: #fff; margin: 0; padding: 16px; max-width: 640px; }
h2 { font-size: 13px; color: #888; text-transform: uppercase; margin: 18px 0 6px; }
ul { margin: 0; padding: 0; }
li { list-style: none; }
fieldset { border: 1px solid #ddd; border-radius: .3rem; margin-bottom: 1rem; }
legend { font-weight: 700; padding: 0 .4rem; }
.form-control { border: 1px solid #ccc; border-radius: .25rem; padding: .3rem .5rem; font: inherit; background: #fff; }
table.formtable td { padding: .35rem .6rem; vertical-align: middle; }
td.title { color: #555; width: 90px; }

/* --- icon picker widget styles (same as injected by the plugin PHP) --- */
.fi-picker { position: relative; display: inline-block; min-width: 16rem; vertical-align: middle; }
.fi-picker-btn { display: flex !important; align-items: center; gap: .5rem; width: 100%;
    text-align: left; cursor: pointer; background: #fff; }
.fi-picker-btn .fi-live-preview { font-size: 1.25em; width: 1.4em; flex: 0 0 auto; }
.fi-picker-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi-picker-caret { flex: 0 0 auto; width: 0; height: 0; border-left: .25em solid transparent;
    border-right: .25em solid transparent; border-top: .3em solid #666; }
.fi-picker-panel { display: none; position: fixed; z-index: 2000;
    background: #fff; border: 1px solid #ccc; border-radius: .25rem;
    box-shadow: 0 .2rem .6rem rgba(0,0,0,.25); }
.fi-picker-panel.open { display: block; }
.fi-picker-search { width: 100%; border: 0; border-bottom: 1px solid #ddd;
    border-radius: .25rem .25rem 0 0; padding: .4rem .5rem; }
.fi-picker-list { overflow-y: auto; padding: .15rem 0; }
.fi-picker-item { display: flex; align-items: center; gap: .6rem; padding: .3rem .7rem; cursor: pointer; }
.fi-picker-item:hover { background: #e8f4fa; }
.fi-picker-item.selected { background: #d5ebf7; }
.fi-picker-item.selected .fi-picker-label { font-weight: 700; }
.fi-picker-item .fi-live-preview { width: 1.4em; flex: 0 0 auto; font-size: 1.15em; text-align: center; }

/* trimmed Elastic list CSS */
.folderlist li a { display: block; padding: .4rem .6rem; text-decoration: none; color: #1c1c1c; }
.folderlist li a:before {
    font-size: 1.25em; display: block; float: left; margin: 0 .25rem 0 0;
    width: 1.18em; height: 1em; font-family: Icons; font-style: normal; font-weight: 900;
    text-align: center; -webkit-font-smoothing: antialiased;
}
.folderlist li.inbox>a:before { content: "\f01c"; font-weight: 900; }
.folderlist li a:before { content: "\f07b"; font-weight: 400; margin-right: .5rem; }
</style>
<link rel="stylesheet" href="../folder_icons/css/folder_icons.css">
</head>
<body>

<h2>Settings &rarr; Folders &rarr; edit folder &quot;Finance&quot;</h2>
<fieldset>
    <legend>Folder icon</legend>
    <table class="formtable">
        <tr>
            <td class="title"><label for="_fi_icon">Icon</label></td>
            <td>
                <div>
                    <select name="_fi_icon" id="_fi_icon" class="form-control">
                        <option value="">(theme default)</option>
                        <option value="rocket" selected>rocket</option>
                        <option value="coins">coins</option>
                        <option value="newspaper">newspaper</option>
                        <option value="star">star</option>
                        <option value="plane">plane</option>
                        <option value="box-archive">box-archive</option>
                    </select>
                    &nbsp; <span id="folder-icons-preview" class="fi-live-preview fi-rocket"></span>
                </div>
            </td>
        </tr>
        <tr>
            <td class="title"><label>Color</label></td>
            <td>
                <div>
                    <input type="checkbox" name="_fi_color_on" id="_fi_color_on" value="1" checked>
                    &nbsp; <label for="_fi_color_on">Custom color</label>
                    &nbsp; <input type="color" name="_fi_color" id="_fi_color" value="#b45309" class="form-control">
                </div>
            </td>
        </tr>
    </table>
</fieldset>

<h2>List &mdash; user prefs override the config map, emoji names match too</h2>
<ul class="folderlist">
    <li class="mailbox inbox"><a href="#">INBOX</a></li>
    <li class="mailbox"><a href="#">📁 Projects</a></li>
    <li class="mailbox"><a href="#">Finance</a></li>
    <li class="mailbox"><a href="#">notes</a></li>
</ul>

<script>
window.rcmail = { env: { folder_icons: {
    // global config map (config.inc.php)
    map: {
        'projects':  { icon: 'building-columns', color: '#0369a1' },
        'finance':   { icon: 'coins' },
        'notes':     { icon: 'file-lines', color: '#64748b' }
    },
    // per-user assignments made in the folder edit form (prefs)
    prefs: {
        'finance': { icon: 'rocket', color: '#b45309' },
        'notes':   { color: '#64748b' }
    },
    default: 'folder-open'
} } };
</script>
<script src="../folder_icons/js/folder_icons.js"></script>
<script>
// open the picker for the screenshot
setTimeout(function(){ var b = document.querySelector('.fi-picker-btn'); if (b) b.click(); }, 300);
</script>
</body>
</html>
